name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt
      - run: pytest tests/ -v --tb=short

  manifest:
    runs-on: ubuntu-latest
    env:
      # Hub commit whose schema/device-manifest.schema.json this repo validates against.
      # Always pin a ref (never track main) so a hub schema change can't break every device at once;
      # bump it deliberately, together with any manifest change the new schema needs.
      HUB_REF: 57c0928fcc4636cb9d3c1f7914fcb2d012baa723
    steps:
      - uses: actions/checkout@v5
      - name: Fetch hub manifest schema
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/renewvan/hub/${HUB_REF}/schema/device-manifest.schema.json" \
            --output "$RUNNER_TEMP/device-manifest.schema.json"
      - name: Validate manifest.json
        run: scripts/validate-manifest.sh "$RUNNER_TEMP/device-manifest.schema.json"
