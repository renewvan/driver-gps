; node-gps — GPS node configuration
; ====================================================
; This file ships with the package and contains every available setting
; with a safe default. DO NOT EDIT — create a config.ini instead and
; override only what you need. config.ini is gitignored and local to
; each install.

[mqtt]
host = localhost
port = 1883
; username =
; password =
client_id = node-gps
reconnect_min_delay = 1.0
reconnect_max_delay = 30.0

[node]
id = gps
update_interval_ms = 3000
; Serial device for the USB GPS module. u-blox-native USB (CDC-ACM) chips
; usually enumerate as /dev/ttyACM0; CP2102/CH340 USB-serial bridge clones
; (common on cheap "U-8 chip" GLONASS/BeiDou/GPS dongles) usually enumerate
; as /dev/ttyUSB0. Find yours after plugging in: `dmesg | tail` on the Pi.
; Add the runtime user (see node-gps.service's User=) to the `dialout`
; group so it can open the device without root.
serial_port = /dev/ttyACM0
; NMEA 0183 output baud rate -- 9600 is the near-universal factory default
; for these modules; some support reconfiguring higher via a vendor tool.
baud_rate = 9600
; Max seconds per poll to wait for a fresh NMEA sentence before publishing
; whatever fix state is already cached (keeps the poll loop from blocking
; indefinitely if the module goes silent).
read_timeout_s = 2.0
